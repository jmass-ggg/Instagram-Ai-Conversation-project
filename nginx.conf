server {
    listen 80;
    server_name jamesgurung.tech www.jamesgurung.tech;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jamesgurung.tech www.jamesgurung.tech;

    # SSL certificates (filled in by certbot)
    ssl_certificate /etc/letsencrypt/live/jamesgurung.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jamesgurung.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Webhook service (FastAPI) — handles all public routes
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
